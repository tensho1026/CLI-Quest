name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        shell: bash
        run: test -z "$(find cmd internal scenes -name '*.go' -type f -exec gofmt -l {} +)"
      - name: Unit and integration tests
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build ./cmd/cliquest
